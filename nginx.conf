
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5m;

    server_tokens     off;
    sendfile          on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    proxy_connect_timeout    10s;
    proxy_read_timeout       60s;
    proxy_send_timeout       60s;
    proxy_request_buffering  off;

    proxy_buffer_size        8k;
    proxy_buffers            8 16k;
    proxy_busy_buffers_size  32k;

    open_file_cache          max=200 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=CACHE:10m max_size=512m inactive=60m use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default  "upgrade";
        ""       "";
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
